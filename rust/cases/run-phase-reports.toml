bin.name = "tfstackplan"
args = ["run", "phase", "--phase", "warming", "--label", "warming caches", "--progress-pct", "40"]
fs.cwd = "../.."

[harness]
env = { TFSTACKPLAN_SERVER = "{fake}", TFSTACKPLAN_EXECUTION = "exec-1", TFSTACKPLAN_PR = "7" }

[[harness.route]]
method = "POST"
path = "/api/phase"
status = 200
body = ''

[status]
code = 0

[env]
inherit = false
