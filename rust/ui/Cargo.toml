[package]
name = "tfstackplan-ui"
version = "0.0.0"
description = "The `tfstackplan ui` service: Google login, the per-tier proxies and the embedded SPA."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tfstackplan_ui"

[dependencies]
tfstackplan-server-clients.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
# One crypto stack, as in the clients crate: AES-256-GCM sessions, SHA-256, randomness.
aws-lc-rs = "1.19.0"
axum = "0.8.4"
# Pinned exactly: a recent release; the same version the clients crate uses.
base64 = "=0.23.1"
futures-util = "0.3.31"
hcl-rs = "=0.19.10"
hyper = { version = "1.6.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.16", features = ["server-graceful", "tokio"] }
# Pinned exactly as in the clients crate: rustls on aws-lc-rs, no native-tls.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
# The SPA is compiled into the binary. `debug-embed` embeds in debug builds too, so tests
# and local runs serve exactly what a release serves instead of reading the disk.
rust-embed = { version = "=8.7.2", features = ["debug-embed"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tfstackplan-server-clients = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
