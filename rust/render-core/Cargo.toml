[package]
name = "tfstackplan-render"
version = "0.0.0"
description = "Pure core of `tfstackplan render`: plan JSON and HCL policy in, markdown out."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hcl-rs = "=0.19.10"
regex = "=1.13.2"
regex-syntax = "=0.8.12"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
yaml-rust2 = { version = "=0.10.4", default-features = false }

[lints]
workspace = true
