[workspace]
resolver = "3"
members = ["tfstackplan", "recorder", "gate-core", "store", "server", "server-clients"]

[workspace.dependencies]
tfstackplan-gate = { path = "gate-core" }
tfstackplan-store = { path = "store" }
tfstackplan-server-clients = { path = "server-clients" }
async-trait = "0.1.89"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["raw_value"] }
jiff = { version = "1.0.3", features = ["serde"] }
thiserror = "2.0.20"
# SQLite compiled into the binary (`bundled`): no system libsqlite3 to match, and the same
# SQLite on every machine. Pinned exactly: a rusqlite bump moves the bundled SQLite with it.
rusqlite = { version = "=0.43.0", features = ["bundled"] }
tempfile = "=3.27.0"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# The lint baseline the organisation's other Rust services use, unchanged. CI builds with
# -D warnings, so every `warn` here fails a pull request; `deny` marks what is never acceptable,
# even while iterating locally. A lint silenced in code says why:
# `#[expect(lint, reason = "…")]`, which also fails once it is stale.
[workspace.lints.rust]
# No crate here needs unsafe; every crate root also forbids it outright.
unsafe_code = "deny"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unwrap_in_result = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 4
strip = "symbols"

# Only the shipped binary compiles in the release profile: dependencies need no debug info there.
[profile.release.package."*"]
debug = false

# Pull request builds lint and test in the dev profile. Our own crates keep line tables only, so
# panics still name file and line while test binaries link in less memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
