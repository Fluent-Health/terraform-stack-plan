# cargo-deny policy for the workspace, the same as the organisation's other Rust services.
# CI runs `cargo deny --locked check advisories bans licenses sources`.

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason, and the date or the
# release that drops it.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.9
# Our own crates are not published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS is rustls everywhere: distroless carries no libssl, and one TLS stack is enough.
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
