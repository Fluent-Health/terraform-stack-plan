# cargo-deny policy for the workspace, the same as the organisation's other Rust services.
# CI runs `cargo deny --locked check advisories bans licenses sources`.

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails the build unless listed here with a reason, and the date or the
# release that drops it.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
unused-allowed-license = "allow"
confidence-threshold = 0.9
# Our own crates are not published.
private = { ignore = true }
# comrak (the /plan fragment's markdown renderer) uses finl_unicode, whose Unicode data tables
# carry the OSI-approved Unicode-DFS-2016 terms. Allowed for that crate only.
exceptions = [{ allow = ["Unicode-DFS-2016"], crate = "finl_unicode" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS is rustls everywhere: distroless carries no libssl, and one TLS stack is enough.
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
  # aws-lc-rs is the one crypto provider (DECISIONS.md); ring sits in Cargo.lock only as an
  # optional dependency of rustls-webpki and quinn-proto that no enabled feature pulls in.
  { crate = "ring", reason = "aws-lc-rs is the only crypto provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
