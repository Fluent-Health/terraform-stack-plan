name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./... | tee test_output.log

      - name: Code Coverage Summary
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}')
          echo "### 📊 Code Coverage Summary: **$TOTAL_COVERAGE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "coverage:" test_output.log | grep -v "no statements" | awk '{gsub("github.com/Fluent-Health/terraform-stack-plan/", "", $2); print "| " $2 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 Detailed Function Coverage" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand detailed function-by-function coverage report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: coverage.out
          comment-report: true
          badge-file-name: coverage.svg

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && matrix.go == 'stable'
        run: |
          sudo chown $USER:$USER coverage.svg || true
          cp coverage.svg /tmp/coverage.svg
          git fetch origin
          git checkout badges 2>/dev/null || git checkout --orphan badges
          git rm -rf . || true
          sudo rm -f coverage.svg || true
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update coverage badge [skip ci]" || exit 0
          git push -u origin badges --force

      - name: build
        run: go build ./...
