name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: openapi codegen in sync
        run: |
          go generate ./internal/api ./internal/uiapi
          if ! git diff --exit-code -- internal/api internal/uiapi; then
            echo "generated OpenAPI code is out of sync with api/*.yaml — run: go generate ./internal/api ./internal/uiapi"
            exit 1
          fi

      - name: test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./... | tee test_output.log

      - name: build
        run: go build ./...

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/ui/.tool-versions

      - name: Install
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Generated TS types in sync
        run: |
          yarn gen:types
          if ! git diff --exit-code -- src/api/tier-schema.d.ts; then
            echo "tier-schema.d.ts is out of sync with api/openapi.yaml — run: yarn gen:types"
            exit 1
          fi

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      TFSTACKPLAN_GO_BIN: ${{ github.workspace }}/rust/.go/tfstackplan-go
    steps:
      - uses: actions/checkout@v7

      # The same Go as the release build, so the replay checks the Go that ships.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # rustup (preinstalled on the runner) installs the toolchain and
      # components pinned in rust/rust-toolchain.toml on first use.
      - name: Build the Go binary
        working-directory: .
        run: CGO_ENABLED=0 go build -o "$TFSTACKPLAN_GO_BIN" ./cmd/tfstackplan

      # Pinned like the toolchain, so CI and local runs use the same versions.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.1

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: rustdoc lints
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # The store's compatibility test opens a database this Go code wrote, so a
      # Go change that alters what the store reads fails here, not later.
      - name: Write the Go database for the store's compatibility test
        working-directory: .
        run: go test -count=1 -run TestWriteRustCompatDB ./internal/server/
        env:
          TFSTACKPLAN_RUST_COMPAT_DB: ${{ runner.temp }}/go.db

      - name: cargo nextest
        run: cargo nextest run --profile pr --workspace --locked
        env:
          TFSTACKPLAN_RUST_COMPAT_DB: ${{ runner.temp }}/go.db

      - name: doctests
        run: cargo test --doc --workspace --locked

      - name: cargo deny
        run: cargo deny --locked check advisories bans licenses sources

      - name: Recorded cases match the Go binary
        run: |
          cargo run -p recorder
          # diff shows changed recordings; status also catches new untracked ones.
          if ! git diff --exit-code -- cases || [ -n "$(git status --porcelain -- cases)" ]; then
            git status --short -- cases
            echo "rust/cases is stale: Go output changed. Re-record with: cargo run -p recorder (see rust/README.md)"
            exit 1
          fi
