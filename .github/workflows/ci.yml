name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: openapi codegen in sync
        run: |
          go generate ./internal/api ./internal/uiapi
          if ! git diff --exit-code -- internal/api internal/uiapi; then
            echo "generated OpenAPI code is out of sync with api/*.yaml — run: go generate ./internal/api ./internal/uiapi"
            exit 1
          fi

      - name: test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./... | tee test_output.log

      - name: build
        run: go build ./...

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/ui/.tool-versions

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Generated TS types in sync
        run: |
          yarn gen:types
          if ! git diff --exit-code -- src/api/tier-schema.d.ts; then
            echo "tier-schema.d.ts is out of sync with api/openapi.yaml — run: yarn gen:types"
            exit 1
          fi

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
