name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./... | tee test_output.log

      - name: Code Coverage Summary
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}')
          echo "### 📊 Code Coverage Summary: **$TOTAL_COVERAGE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          grep "coverage:" test_output.log | grep -v "no statements" | awk '{gsub("github.com/Fluent-Health/terraform-stack-plan/", "", $2); print "| " $2 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 Detailed Function Coverage" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand detailed function-by-function coverage report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Check test coverage (PR comments)
        if: github.event_name == 'pull_request' && matrix.go == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run the check and save output, ignoring exit code temporarily so we can comment first
          go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 --config=./.testcoverage.yml > coverage_report.txt 2>&1 || err_code=$?
          
          # Print report to GHA log
          cat coverage_report.txt
          
          # Construct PR comment body file
          echo "### 📊 Go Test Coverage Report" > comment_body.txt
          echo "" >> comment_body.txt
          echo '```' >> comment_body.txt
          cat coverage_report.txt >> comment_body.txt
          echo '```' >> comment_body.txt
          
          # Find existing comment from github-actions[bot]
          comment_id=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select((.author.login | contains("github-actions")) and (.body | contains("Go Test Coverage Report"))) | .id' | head -n 1)
          
          if [ -n "$comment_id" ]; then
            # Update existing comment
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -F body=@comment_body.txt
          else
            # Post new comment
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment_body.txt
          fi
          
          # Now exit with the actual check code
          exit ${err_code:-0}

      - name: Check test coverage & update badge (main push)
        if: github.event_name != 'pull_request'
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: coverage.out
          badge-file-name: coverage.svg
          git-token: ${{ github.ref == 'refs/heads/main' && matrix.go == 'stable' && github.token || '' }}
          git-branch: badges

      - name: build
        run: go build ./...
