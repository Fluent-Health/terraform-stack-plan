name: Release

# Create a GitHub Release (e.g. tag v1.2.0 and publish it); this workflow then
# builds the binaries for every target and attaches them to that release.
on:
  release:
    types: [published]

permissions:
  contents: write # upload assets to the release

jobs:
  # The SPA is built once and embedded into every binary: the repo commits
  # only a placeholder under internal/ui/dist, and this job's artifact
  # replaces it before each go build — go build itself never runs node.
  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/ui/.tool-versions

      - name: Install, check, build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn typecheck
          yarn test
          yarn build

      - uses: actions/upload-artifact@v7
        with:
          name: spa-dist
          path: web/ui/dist

  build:
    runs-on: ubuntu-latest
    needs: spa
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Embed the built SPA
        uses: actions/download-artifact@v8
        with:
          name: spa-dist
          path: internal/ui/dist

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          bin="tfstackplan"
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${bin}${ext}" ./cmd/tfstackplan

          base="tfstackplan_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset="${base}.zip"
            zip -q "$asset" "${bin}${ext}" README.md LICENSE
          else
            asset="${base}.tar.gz"
            tar -czf "$asset" "${bin}${ext}" README.md LICENSE
          fi
          sha256sum "$asset" > "${asset}.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload binary artifact
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tfstackplan

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-amd64
          path: bin/linux/amd64

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-arm64
          path: bin/linux/arm64

      - name: Set execute permissions
        run: |
          chmod +x bin/linux/amd64/tfstackplan bin/linux/arm64/tfstackplan

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR rejects uppercase repository names; github.repository preserves the
      # org casing (Fluent-Health/...), so lowercase it before tagging.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
