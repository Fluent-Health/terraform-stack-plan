name: Release

# Create a GitHub Release (e.g. tag v1.2.0 and publish it); this workflow then
# builds the binaries for every target and attaches them to that release.
on:
  release:
    types: [published]

permissions:
  contents: write # upload assets to the release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          bin="tfstackplan"
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${bin}${ext}" ./cmd/tfstackplan

          base="tfstackplan_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset="${base}.zip"
            zip -q "$asset" "${bin}${ext}" README.md LICENSE
          else
            asset="${base}.tar.gz"
            tar -czf "$asset" "${bin}${ext}" README.md LICENSE
          fi
          sha256sum "$asset" > "${asset}.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR rejects uppercase repository names; github.repository preserves the
      # org casing (Fluent-Health/...), so lowercase it before tagging.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
