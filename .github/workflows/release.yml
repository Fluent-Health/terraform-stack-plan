name: Release

# Create a GitHub Release (e.g. tag v1.2.0 and publish it); this workflow then
# builds the binaries for every target and attaches them to that release.
#
# Each archive ships two binaries side by side: `tfstackplan` is the Rust front
# door and `tfstackplan-go` is the Go binary it runs for every subcommand not
# ported yet (see rust/README.md). Nothing is uploaded until the smoke job has
# run the linux/amd64 archive and the release image.
#
# Actions are pinned to commit SHAs and tools to exact versions, since this
# workflow can write to the release and the registry.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The SPA is built once and embedded into every binary: the repo commits
  # only a placeholder under internal/ui/dist, and this job's artifact
  # replaces it before each go build — go build itself never runs node.
  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/ui/.tool-versions

      - name: Install, check, build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn typecheck
          yarn test
          yarn build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spa-dist
          path: web/ui/dist

  # The same dependency gate as CI, so a release never ships a crate CI would
  # reject (an advisory published after the last PR, for example).
  deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1

      - name: cargo deny
        run: cargo deny --locked check

  build:
    runs-on: ubuntu-latest
    needs: [spa, deny]
    strategy:
      fail-fast: false
      matrix:
        # target is the Rust target for the front door. Linux uses musl so the
        # binary is static and runs on distroless static (rust/DECISIONS.md).
        include:
          - { goos: linux, goarch: amd64, target: x86_64-unknown-linux-musl }
          - { goos: linux, goarch: arm64, target: aarch64-unknown-linux-musl }
          - { goos: darwin, goarch: amd64, target: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, target: aarch64-apple-darwin }
          - { goos: windows, goarch: amd64, target: x86_64-pc-windows-gnu }
          - { goos: windows, goarch: arm64, target: aarch64-pc-windows-gnullvm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Embed the built SPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spa-dist
          path: internal/ui/dist

      # cargo-zigbuild links every target with zig, so one Linux runner builds
      # them all. rustup (preinstalled) installs the toolchain pinned in
      # rust/rust-toolchain.toml on first use.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1

      - name: Build the Rust front door
        working-directory: rust
        env:
          TARGET: ${{ matrix.target }}
          # Compiled in for ported subcommands that print the version (once render is
          # in Rust it answers -version); unused until then.
          TFSTACKPLAN_VERSION: ${{ github.event.release.tag_name }}
        run: |
          rustup target add "$TARGET"
          cargo zigbuild --release --locked -p tfstackplan --target "$TARGET"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "tfstackplan-go${ext}" ./cmd/tfstackplan
          cp "rust/target/${TARGET}/release/tfstackplan${ext}" "tfstackplan${ext}"

          base="tfstackplan_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset="${base}.zip"
            zip -q "$asset" "tfstackplan${ext}" "tfstackplan-go${ext}" README.md LICENSE
          else
            asset="${base}.tar.gz"
            tar -czf "$asset" "tfstackplan${ext}" "tfstackplan-go${ext}" README.md LICENSE
          fi
          sha256sum "$asset" > "${asset}.sha256"
          mkdir dist
          mv "$asset" "${asset}.sha256" dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # Runs what users and the image will run, before anything leaves this
  # workflow: the linux/amd64 archive through the front door, and the release
  # image built from those same binaries.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-amd64
          path: dist

      - name: Archive prints the release tag
        run: |
          set -euo pipefail
          asset="tfstackplan_${VERSION}_linux_amd64.tar.gz"
          (cd dist && sha256sum -c "${asset}.sha256")
          mkdir -p bin/linux/amd64
          tar -xzf "dist/${asset}" -C bin/linux/amd64 tfstackplan tfstackplan-go
          got="$(bin/linux/amd64/tfstackplan -version)"
          echo "$got"
          [ "$got" = "tfstackplan ${VERSION}" ] || { echo "expected 'tfstackplan ${VERSION}'" >&2; exit 1; }

      - name: Release image prints the release tag
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.release -t tfstackplan:smoke .
          got="$(docker run --rm --entrypoint tfstackplan tfstackplan:smoke -version)"
          echo "$got"
          [ "$got" = "tfstackplan ${VERSION}" ] || { echo "expected 'tfstackplan ${VERSION}'" >&2; exit 1; }

  upload:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  image:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-linux-*
          merge-multiple: true
          path: dist

      # The image ships exactly the binaries in the linux archives.
      - name: Extract linux binaries
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "bin/linux/${arch}"
            tar -xzf "dist/tfstackplan_${VERSION}_linux_${arch}.tar.gz" -C "bin/linux/${arch}" tfstackplan tfstackplan-go
          done

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR rejects uppercase repository names; github.repository preserves the
      # org casing (Fluent-Health/...), so lowercase it before tagging.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          # A pre-release (used to exercise this pipeline) never moves :latest;
          # the empty line it leaves is ignored by the action.
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && format('{0}:latest', env.IMAGE) || '' }}
