<!doctype html>
<!-- Placeholder shipped when the SPA has not been built. CI/release replaces
     this whole dist/ directory with the web/ui/ Vite build output. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tfstackplan ui</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
    main { text-align: center; }
    code { background: #1e293b; padding: .2em .5em; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>tfstackplan ui</h1>
    <p>The SPA is not built into this binary — this is the committed placeholder.</p>
    <p>Release builds embed the <code>web/ui</code> Vite output here.</p>
    <p>API health: <code>/healthz</code> · sign in: <code>/auth/login</code></p>
  </main>
</body>
</html>
