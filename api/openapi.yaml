openapi: 3.0.3
info:
  title: tfstackplan control-plane API
  version: "1"
  description: |
    The `/api` surface of a tfstackplan tier serve: the runner→server execution
    lifecycle (init → phase → per-stack updates → finalize, plus log ingest and
    the apply-time gate exchange), the apply-lock claim verbs, and the
    execution read.

    This document is the wire contract. It mirrors the shapes in
    `internal/events` (the schemas are bound to those Go types via `x-go-type`
    — there is exactly one canonical definition) and is consumed by code
    generation on both sides: the serve router/stubs and the Go client. Serve
    and runner deploy independently, so changes here are cross-version protocol
    changes: additive only, never a field rename or removal. The byte-level
    truth is pinned by `internal/server/testdata/wire/`.

    Deliberately out of scope: the SSE streams (`GET
    /api/execution/{id}/events`, `/logs/{exec}/{stack}?follow=1` — OpenAPI does
    not model event streams usefully; they are hand-rolled), the GitHub webhook
    and Pub/Sub push endpoints (external contracts), and the public `/img`,
    `/assets`, `/live` surfaces.

    Authentication: every operation requires a Google-signed OIDC ID token
    (bearer). The verified email maps to scopes (`report`, `read`, `admin`) in
    the serve config; each operation lists its accepted scopes (any-of) in
    `x-scopes`. Rejections are `401 unauthorized` / `403 forbidden` as
    `text/plain`.

    Error model: gate-check failures return machine-readable
    `{code, message}` JSON (`CodedError`); every other failure is a
    `text/plain` message with the appropriate HTTP status.
paths:
  /api/init:
    post:
      operationId: initExecution
      summary: Register an execution and its changed subgraph
      description: |
        Idempotent per execution id — a repeat Init resets per-stack statuses
        to the payload values but never regresses an already-advanced stack.
        Creates/refreshes the GitHub check run and may supersede a live
        same-(pr, environment) execution for an older SHA.
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Init"
      responses:
        "200":
          description: Recorded.
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
        "502":
          description: The GitHub check run could not be created.
          content:
            text/plain: {}
  /api/phase:
    post:
      operationId: reportPhase
      summary: Narrate a lifecycle phase transition
      description: May arrive before Init; the execution row is upserted.
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhaseEvent"
      responses:
        "200":
          description: Recorded.
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
        "502":
          description: The GitHub check run could not be created.
          content:
            text/plain: {}
  /api/update:
    post:
      operationId: updateStack
      summary: Tick a single stack's status
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Update"
      responses:
        "200":
          description: Recorded.
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/finalize:
    post:
      operationId: finalizeExecution
      summary: Record the terminal plan state
      description: |
        Persists the rendered report and per-stack backfills, records the gate
        targets through the reconcile core (requesting approval grants), and
        drives the terminal check-run conclusion.
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Finalize"
      responses:
        "200":
          description: Recorded.
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/logs:
    post:
      operationId: appendLogs
      summary: Ingest a per-stack output chunk
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogChunk"
      responses:
        "200":
          description: Appended.
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/gate/check:
    post:
      operationId: checkGate
      summary: Apply-time, fail-closed gate pre-check
      description: |
        200 only when the (pr, environment) was classified AND every recorded
        gate target's grant is ACTIVE (a classified plan with no gates passes,
        with an empty requester). Reconciles against the approval backend
        first; when current grant state cannot be confirmed the check fails
        closed with 503 `GATE-003` rather than trusting a stale cache.
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateCheck"
      responses:
        "200":
          description: Gate satisfied; apply may proceed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateCheckOK"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "409":
          description: >-
            Gate not passable: `GATE-001` (never classified) or `GATE-002`
            (a required grant is not ACTIVE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "500":
          description: Internal error (`SRV-001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
        "503":
          description: >-
            Gate state could not be freshly confirmed (`GATE-003`) —
            transient, retriable, fail-closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedError"
  /api/gate/revoke:
    post:
      operationId: revokeGate
      summary: Revoke the grants requested for (pr, environment)
      description: >-
        Best-effort post-apply cleanup; also releases the apply-lock claim.
        Always 200 — revoke failures are logged server-side, not surfaced.
      security:
        - oidc: [report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateRevoke"
      responses:
        "200":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequestText"
  /api/claims/list:
    post:
      operationId: listClaims
      summary: List the apply-lock claims for an environment
      security:
        - oidc: [report, read, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimsListRequest"
      responses:
        "200":
          description: The environment's claims. Always a JSON array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/claims/release:
    post:
      operationId: releaseClaims
      summary: Admin-release one stack's claim or all of a PR's claims
      description: >-
        stack != "" releases that stack's claim; stack == "" releases every
        claim the PR holds in the environment. Always 200 (best-effort).
      security:
        - oidc: [report, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimsReleaseRequest"
      responses:
        "200":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequestText"
  /api/catalog:
    get:
      operationId: getCatalog
      summary: Retrieve the compiled component catalog of the main branch
      description: Returns pre-aggregated topology, components, and edges.
      security:
        - oidc: [report, read, admin]
      responses:
        "200":
          description: The pre-aggregated Component Graph JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /api/executions:
    get:
      operationId: listExecutions
      summary: List executions, newest first
      description: |
        The recent-executions feed (default 100, cap 1000). `pr` filters to one
        pull request's full timeline across plan/apply/verify runs. Summaries
        deliberately exclude the rendered report — fetch one execution for
        that.
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: pr
          in: query
          required: false
          schema:
            type: integer
          description: Only executions for this pull request.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Execution summaries, newest first. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionSummary"
        "400":
          $ref: "#/components/responses/BadRequestText"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/approvals:
    get:
      operationId: listApprovals
      summary: List gate targets awaiting human action, across all PRs
      description: |
        Every recorded gate target not yet ACTIVE, with the PR context an
        approvals surface needs (repo from the PR's latest execution in that
        environment) and the grant resource name an approval call targets.
        DENIED/REVOKED targets are included — they need attention even though
        the action is not "approve".
      security:
        - oidc: [report, read, admin]
      responses:
        "200":
          description: Pending approvals. Always an array, never null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingApproval"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/pr/{n}:
    get:
      operationId: getPR
      summary: Read a pull request's identity and per-tier merge state
      description: |
        PR identity (title/author/branch/automerge, as last reported by the
        GitHub webhook) plus this serve tier's merge-readiness verdict (the
        required check and apply-lock state for `a.cfg.Environment`). `meta`
        is omitted when no metadata row has been recorded for the PR. 404
        when the PR is entirely unknown to this tier (no metadata and no
        execution).
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The PR's identity and merge state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PRView"
        "404":
          description: Unknown PR.
          content:
            text/plain: {}
        "500":
          $ref: "#/components/responses/InternalText"
  /api/merge-queue:
    get:
      operationId: mergeQueue
      summary: Read the repository's live GitHub merge queue (default branch)
      description: |
        The repository's merge-queue entries for its default branch, via the
        GitHub GraphQL API. Tier-agnostic (per-repo); repo is taken from this
        tier's newest execution. Degrades to an empty queue (HTTP 200) when
        the repo has no merge queue, the token cannot see it, or no execution
        has been recorded yet.
      security:
        - oidc: [report, read, admin]
      responses:
        "200":
          description: The merge queue (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeQueue"
        "500":
          $ref: "#/components/responses/InternalText"
  /api/execution/{id}:
    get:
      operationId: getExecution
      summary: Read one execution's full state
      description: |
        The execution row, its stack/edge graph, and the gate targets for its
        (pr, environment). NOTE the response's top-level and `gates` keys are
        PascalCase and `CheckRunID` is a raw `{Int64, Valid}` pair — a
        historical accident preserved for wire compatibility.
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionDetail"
        "404":
          description: Unknown execution id.
          content:
            text/plain: {}
        "500":
          $ref: "#/components/responses/InternalText"
  /api/inspect/grants:
    get:
      operationId: inspectGrants
      summary: List all recorded grants
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: live
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectGrant"
  /api/inspect/gate/{pr}/{env}:
    get:
      operationId: inspectGate
      summary: Get gate state explainer and reason trail
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: pr
          in: path
          required: true
          schema:
            type: integer
        - name: env
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectGateDetail"
  /api/inspect/claims/{env}:
    get:
      operationId: inspectClaims
      summary: Get folded claim set for an environment
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: env
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectClaimsSet"
  /api/inspect/events/{stream}:
    get:
      operationId: inspectEvents
      summary: Get ordered events for a stream
      security:
        - oidc: [report, read, admin]
      parameters:
        - name: stream
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectEvent"
  /api/inspect/overview:
    get:
      operationId: inspectOverview
      summary: System-wide overview of all active PR states
      security:
        - oidc: [report, read, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectPRSummary"

  /api/inspect/pool:
    get:
      operationId: inspectPool
      summary: Get applier-pool slot occupancy and waiting lists
      security:
        - oidc: [report, read, admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectPoolSet"

  /api/admin/grants/release:
    post:
      operationId: adminGrantsRelease
      summary: Admin release a gate grant
      security:
        - oidc: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantsReleaseRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/InternalText"
        "500":
          $ref: "#/components/responses/InternalText"

  /api/admin/executions/cancel:
    post:
      operationId: adminExecutionsCancel
      summary: Admin cancel a running execution
      security:
        - oidc: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminExecutionsCancelRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/InternalText"
        "500":
          $ref: "#/components/responses/InternalText"

  /api/admin/gates/satisfy:
    post:
      operationId: adminGatesSatisfy
      summary: Admin satisfy a gate target manually
      security:
        - oidc: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGatesSatisfyRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/InternalText"
        "500":
          $ref: "#/components/responses/InternalText"

  /api/admin/checks/override:
    post:
      operationId: adminChecksOverride
      summary: Admin override a check conclusion
      security:
        - oidc: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChecksOverrideRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/InternalText"
        "500":
          $ref: "#/components/responses/InternalText"

components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: "Google-signed OIDC ID token"
  responses:
    BadRequestText:
      description: Malformed payload (decode/validation error as plain text).
      content:
        text/plain: {}
    InternalText:
      description: Server-side failure (plain-text message).
      content:
        text/plain: {}
  schemas:
    AdminGrantsReleaseRequest:
      type: object
      required: [pr, environment, class, target, reason]
      properties:
        pr: { type: integer }
        environment: { type: string }
        class: { type: string }
        target: { type: string }
        reason: { type: string }
    AdminExecutionsCancelRequest:
      type: object
      required: [id, reason]
      properties:
        id: { type: string }
        reason: { type: string }
    AdminGatesSatisfyRequest:
      type: object
      required: [pr, environment, class, target, reason]
      properties:
        pr: { type: integer }
        environment: { type: string }
        class: { type: string }
        target: { type: string }
        reason: { type: string }
    AdminChecksOverrideRequest:
      type: object
      required: [pr, environment, check, conclusion, reason]
      properties:
        pr: { type: integer }
        environment: { type: string }
        check: { type: string }
        conclusion: { type: string }
        reason: { type: string }
    Status:
      type: string
      description: >-
        Per-stack lifecycle status. Decoding rejects unknown non-empty values
        (WIRE-001); an omitted/empty status is tolerated.
      enum:
        - pending
        - initializing
        - initialized
        - running
        - planned
        - gated
        - safe
        - nochange
        - moving
        - failed
        - aborted
      x-go-type: events.Status
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Phase:
      type: string
      description: Execution-wide lifecycle phase.
      enum:
        - warming
        - linting
        - initializing
        - planning
        - applying
        - testing
        - verifying
      x-go-type: events.Phase
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Category:
      type: object
      description: A classification label matched by a stack.
      required: [name]
      properties:
        name:
          type: string
        icon:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      x-go-type: events.Category
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Counts:
      type: object
      description: A stack's per-kind operation tally (zero counts omitted).
      properties:
        add: { type: integer }
        change: { type: integer }
        destroy: { type: integer }
        replace: { type: integer }
        move: { type: integer }
        import: { type: integer }
        forget: { type: integer }
        sensitivity_only: { type: integer }
      x-go-type: events.Counts
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    StackState:
      type: object
      description: One node in the execution graph.
      required: [path]
      properties:
        path:
          type: string
        project:
          type: string
          description: Grouping/target key (e.g. cloud project/account).
        status:
          $ref: "#/components/schemas/Status"
        detail:
          type: string
          description: Optional failure detail (last error lines).
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        counts:
          $ref: "#/components/schemas/Counts"
      x-go-type: events.StackState
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Edge:
      type: object
      description: "A dependency: from must run before to."
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
      x-go-type: events.Edge
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Graph:
      type: object
      description: The changed subgraph for one execution.
      required: [stacks, edges]
      properties:
        stacks:
          type: array
          description: Always an array — empty (never null) for a zero-stack execution.
          items:
            $ref: "#/components/schemas/StackState"
        edges:
          type: array
          description: Always an array, never null (serves < v0.25.2 emitted null).
          items:
            $ref: "#/components/schemas/Edge"
      x-go-type: events.Graph
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    GateTarget:
      type: object
      description: >-
        One thing that must be approved: a classification class against a
        target (e.g. a cloud project).
      required: [class, target]
      properties:
        class: { type: string }
        target: { type: string }
      x-go-type: events.GateTarget
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Init:
      type: object
      description: Registers an execution and its changed subgraph.
      required: [id, repo, sha, pr, environment, log_url, stacks, edges]
      properties:
        id: { type: string }
        repo: { type: string }
        sha: { type: string }
        pr: { type: integer }
        environment: { type: string }
        log_url:
          type: string
          description: CI log deep-link, shown on failures.
        context:
          type: string
          description: Commit-status context this run drives.
        stacks:
          type: array
          items:
            $ref: "#/components/schemas/StackState"
        edges:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Edge"
      x-go-type: events.Init
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    PhaseEvent:
      type: object
      description: Narrates a lifecycle phase transition (may arrive before Init).
      required: [id, phase]
      properties:
        id: { type: string }
        repo: { type: string }
        sha: { type: string }
        pr: { type: integer }
        environment: { type: string }
        log_url: { type: string }
        context: { type: string }
        phase:
          $ref: "#/components/schemas/Phase"
        label: { type: string }
        progress_pct: { type: integer, minimum: 0, maximum: 100 }
      x-go-type: events.PhaseEvent
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Update:
      type: object
      description: Ticks a single stack's status.
      required: [id, stack, status]
      properties:
        id: { type: string }
        stack: { type: string }
        status:
          $ref: "#/components/schemas/Status"
        detail: { type: string }
      x-go-type: events.Update
      x-go-type-import:
        path: github.com/Fluent-Health/terraform-stack-plan/internal/events
    Finalize:
      type: object
      description: Records the terminal plan state.
      required: [id, report_markdown]
      properties:
        id: { type: string }
        report_markdown: { type: string }
        projects:
          type: object
          description: Stack path → grouping/target key.
          additionalProperties: { type: string }
        stack_reports:
          type: object
          description: Stack path → rendered plan section (markdown).
          additionalProperties: { type: string }
        gates:
          type: array
          description: (class, target) pairs needing approval.
          items:
